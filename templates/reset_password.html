{% extends "base.html" %}

{% block title %}Verify OTP - OmniScanX{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card text-center">
            <h2 class="mb-4 fw-bold">Set New Password</h2>
            <p class="text-light mb-4">Please enter the 6-digit OTP sent to your email and your new password.</p>
            
            <form action="/reset_password" method="POST">
                <div class="mb-3 text-start">
                    <label for="otp" class="form-label"><i class="fa-solid fa-key"></i> Enter OTP</label>
                    <input type="text" class="form-control form-control-glass text-center fw-bold fs-4" id="otp" name="otp" placeholder="• • • • • •" required maxlength="6" pattern="\d{6}">
                </div>

                <div class="mb-4 text-start">
                    <label for="new_password" class="form-label"><i class="fa-solid fa-lock"></i> New Password</label>
                    <input type="password" class="form-control form-control-glass" id="new_password" name="new_password" placeholder="Enter new password" required minlength="6">
                </div>
                
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-animated animate-pulse-slow">
                        Reset Password <i class="fa-solid fa-check-circle ms-2"></i>
                    </button>
                </div>
            </form>
            
            <div class="mt-4">
                <a href="{{ url_for('login') }}" class="text-light text-decoration-none small">Cancel and return to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
