{% extends "base.html" %}

{% block title %}Forgot Password - OmniScanX{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card text-center">
            <h2 class="mb-4 fw-bold">Reset Password</h2>
            <p class="text-light mb-4">Enter your email to receive a password reset OTP.</p>
            
            <form action="/forgot_password" method="POST">
                <div class="mb-4 text-start">
                    <label for="email" class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" class="form-control form-control-glass" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-animated animate-pulse-slow">
                        Send OTP <i class="fa-solid fa-paper-plane ms-2"></i>
                    </button>
                </div>
                
                <div class="mt-3">
                    <a href="{{ url_for('login') }}" class="text-light text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
