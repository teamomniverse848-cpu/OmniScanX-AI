{% extends "base.html" %}

{% block title %}Verify OTP - OmniScanX{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card text-center">
            <h2 class="mb-4 fw-bold">2-Step Verification</h2>
            <p class="text-light mb-4">Enter the 6-digit OTP sent to your registered email address to complete the login process.</p>
            
            <form action="/verify_otp" method="POST">
                <div class="mb-4 text-start">
                    <label for="otp" class="form-label"><i class="fa-solid fa-key"></i> Enter OTP</label>
                    <input type="text" class="form-control form-control-glass text-center fs-4 letter-spacing-2" id="otp" name="otp" placeholder="• • • • • •" maxlength="6" required autocomplete="off">
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-animated animate-pulse-slow">
                        Verify Code <i class="fa-solid fa-check-circle ms-2"></i>
                    </button>
                </div>
            </form>
            
            <div class="mt-4">
                <a href="/login" class="text-light text-decoration-none"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
